name: FRAME checks
on: [push, pull_request]
jobs:
  prototype:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix apps/web ci
      - run: npm run build
      - run: npm test
